# unraid-certbot 默认配置
#
# 本文件随插件分发（位于 RAM 中），重启后还原。
# 用户保存的配置写入 /boot/config/plugins/unraid-certbot/unraid-certbot.cfg，
# Unraid 将两者合并，flash 上的用户配置优先。
#
# 注意：Cloudflare API Token 不在本文件中，单独存放于
# /boot/config/plugins/unraid-certbot/cloudflare.ini，权限 600。
#
# 另请注意：注释中不要出现圆括号，PHP 的 parse_ini_file 会将其视为语法错误。

ACME_EMAIL=""
UNRAID_HOSTNAME=""
DOMAINS=""
PROPAGATION="60"
CERT_DIR="/boot/config/letsencrypt"
SCHEDULE="daily"
RESTART_NGINX="yes"
STAGING="no"
RUN_AT_BOOT="no"
