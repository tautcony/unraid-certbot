# unraid-certbot 默认配置
#
# 这个文件随插件分发（位于 RAM 里），重启会还原。
# 用户保存的配置写在 /boot/config/plugins/unraid-certbot/unraid-certbot.cfg，
# Unraid 会把两者合并，flash 上的用户配置优先。
#
# 注意：Cloudflare API Token 不在这个文件里，它单独存放在
# /boot/config/plugins/unraid-certbot/cloudflare.ini，权限 600。
#
# 另外注意：注释里不要出现圆括号，PHP 的 parse_ini_file 会把它当成语法错误。

ACME_EMAIL=""
UNRAID_HOSTNAME=""
DOMAINS=""
PROPAGATION="60"
CERT_DIR="/boot/config/letsencrypt"
SCHEDULE="daily"
RESTART_NGINX="yes"
STAGING="no"
RUN_AT_BOOT="no"
