name: release

# 推 tag 发版；失败时用 workflow_dispatch 重跑，不要删 tag 重推 —— 删除和重推
# 都会再触发 push 事件，两个 run 抢同一个 release。版本号只从 tag 取。
on:
  push:
    tags:
      - '[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]'
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，必须是已存在的 tag，形如 2026.09.10'
        required: true

permissions:
  contents: write

# 同一版本串行执行
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
  release:
    runs-on: ubuntu-latest
    # 删除 tag 也触发 push；此时发不了版，且 gh release create 会把 tag 建回来
    if: ${{ github.event.deleted != true }}
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - name: 解析版本号
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::版本号应形如 2026.09.10，当前为 ${VERSION}"
            exit 1
          fi
          echo "发版版本：${VERSION}"

      - uses: actions/checkout@v4
        with:
          # 手动触发时默认拿到的是分支，要显式切到 tag
          ref: ${{ github.event.inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils xz-utils

      - name: 静态检查
        run: ./lint.sh

      - name: 打包
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null \
            || { echo "::error::tag ${VERSION} 不存在，请先推送 tag"; exit 1; }
          ./build.sh "${VERSION}"

      - name: 校验产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="dist/unraid-certbot-${VERSION}-noarch-1.txz"
          [ -f "$pkg" ] || { echo "::error::没有产出 $pkg"; exit 1; }

          md5="$(md5sum "$pkg" | cut -d' ' -f1)"
          sha="$(sha256sum "$pkg" | cut -d' ' -f1)"

          # 校验和写错会让 Unraid 把 .plg 丢进 plugins-error/
          grep -q "<MD5>${md5}</MD5>" unraid-certbot.plg \
            || { echo "::error::.plg 里的 MD5 与实际包不符"; exit 1; }
          grep -q "<SHA256>${sha}</SHA256>" unraid-certbot.plg \
            || { echo "::error::.plg 里的 SHA256 与实际包不符"; exit 1; }

          # URL 与属性用的是 &version; 这类实体，必须展开后再比
          declared="$(xmllint --noent --xpath 'string(/PLUGIN/@version)' unraid-certbot.plg)"
          [ "$declared" = "$VERSION" ] \
            || { echo "::error::.plg 声明的版本是 ${declared}，与 tag ${VERSION} 不一致"; exit 1; }

          expanded="$(xmllint --noent unraid-certbot.plg)"
          grep -q "releases/download/${VERSION}/" <<<"$expanded" \
            || { echo "::error::.plg 里的下载地址没有指向本次 tag"; exit 1; }

          # 同一 tag 的资产一旦发布，重跑只能得到完全相同的字节。
          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing="$(gh release view "$VERSION" --json assets \
              --jq ".assets[] | select(.name == \"$pkg\") | .digest")"
            if [ -n "$existing" ]; then
              [ "$existing" = "sha256:${sha}" ] \
                || { echo "::error::已发布资产的 SHA256 为 ${existing}，本次为 sha256:${sha}；拒绝覆盖同一 tag"; exit 1; }
              echo "RELEASE_ASSET_EXISTS=true" >> "$GITHUB_ENV"
            fi
          fi

          echo "校验通过：版本 ${declared}，MD5 ${md5}"

      # 先提交 .plg 再上传资产：反过来的话，提交失败会留下「新资产 + 旧 .plg」
      - name: 把更新后的 .plg 提交回默认分支
        run: |
          set -euo pipefail

          # 处于 detached HEAD；先把 build.sh 改好的 .plg 挪出工作区
          cp unraid-certbot.plg /tmp/unraid-certbot.plg
          cp VERSION            /tmp/VERSION

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 默认分支上可能有并发提交，推送被拒就重来一轮
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            # -f：丢掉工作区里的 .plg（真件已备份）；不加会因本地修改被拒
            git checkout -f -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

            cp /tmp/unraid-certbot.plg unraid-certbot.plg
            cp /tmp/VERSION             VERSION

            git add unraid-certbot.plg VERSION
            if git diff --cached --quiet; then
              echo ".plg 无变化，跳过提交"
              exit 0
            fi

            git commit -m "release: ${VERSION}"
            if git push origin "$DEFAULT_BRANCH"; then
              echo "已提交 .plg 到 ${DEFAULT_BRANCH}"
              exit 0
            fi
            echo "推送被拒，重试 ${attempt}/3"
            sleep 3
          done

          echo "::error::.plg 提交失败，本次没有上传资产，请重跑"
          exit 1

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="dist/unraid-certbot-${VERSION}-noarch-1.txz"

          # 从 .plg 的 CHANGES 里抽出本次版本的更新说明
          awk -v v="$VERSION" '
            index($0, "###" v) == 1 { capture = 1; next }
            /^###/          { capture = 0 }
            /^<\/CHANGES>/  { capture = 0 }
            capture { print }
          ' unraid-certbot.plg > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "unraid-certbot ${VERSION}" > /tmp/notes.md
          fi

          cat >> /tmp/notes.md <<EOF

          ## 安装

          \`\`\`
          plugin install https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/unraid-certbot.plg
          \`\`\`
          EOF

          # 已发布的相同资产无需覆盖；--verify-tag 防止 gh 自己创建 tag。
          if [ "${RELEASE_ASSET_EXISTS:-}" = true ]; then
            echo "资产已存在且 SHA256 一致，跳过上传"
          elif gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$pkg"
          else
            gh release create "$VERSION" \
              --verify-tag \
              --title "unraid-certbot ${VERSION}" \
              --notes-file /tmp/notes.md \
              "$pkg"
          fi

      - name: 发布结果
        run: |
          echo "### unraid-certbot ${VERSION} 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "安装地址：" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "plugin install https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/unraid-certbot.plg" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
