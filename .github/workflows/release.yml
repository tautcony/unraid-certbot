name: release

# 两种发布都由工具脚本触发；版本源码始终从对应 tag 读取。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号，必须是已存在的 tag，形如 2026.09.10'
        required: true
      mode:
        description: 'new 首次发布；republish 从该 tag 重新构建同一版本'
        type: choice
        options: [republish, new]
        default: republish
        required: true

permissions:
  contents: write

# 同一版本串行执行
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  RELEASE_MODE: ${{ inputs.mode }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: 解析版本号
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::版本号应形如 2026.09.10，当前为 ${VERSION}"
            exit 1
          fi
          case "$RELEASE_MODE" in new|republish) ;; *) echo "::error::无效发布模式 ${RELEASE_MODE}"; exit 1 ;; esac
          echo "发版版本：${VERSION}"
          echo "发布模式：${RELEASE_MODE}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0

      - name: 校验 tag 与发布目标
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null \
            || { echo "::error::tag ${VERSION} 不存在"; exit 1; }
          [ "$(tr -d '[:space:]' < VERSION)" = "$VERSION" ] \
            || { echo "::error::源码 VERSION 与目标版本 ${VERSION} 不一致"; exit 1; }
          git fetch origin "$DEFAULT_BRANCH"
          current="$(git show "origin/$DEFAULT_BRANCH:VERSION" | tr -d '[:space:]')"
          if [ "$current" != "$VERSION" ] && [ "$RELEASE_MODE" = new ]; then
            echo "::error::默认分支 VERSION 为 ${current}，不能将旧版本提升为最新安装入口"
            exit 1
          fi

      - name: 确定包修订号
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision=1
          if [ "$RELEASE_MODE" = republish ]; then
            gh release view "$VERSION" >/dev/null \
              || { echo "::error::没有可重发的 Release ${VERSION}"; exit 1; }
            last="$(gh release view "$VERSION" --json assets --jq '.assets[].name' \
              | sed -n "s/^unraid-certbot-${VERSION}-noarch-\\([0-9][0-9]*\\)\\.txz$/\\1/p" \
              | sort -n | tail -1)"
            [ -n "$last" ] || { echo '::error::Release 中没有现有包'; exit 1; }
            revision=$((last + 1))
          fi
          echo "PACKAGE_REVISION=${revision}" >> "$GITHUB_ENV"
          echo "包修订号：${revision}"

      - name: 安装依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils xz-utils

      - name: 静态检查
        run: ./lint.sh

      - name: 打包
        run: |
          set -euo pipefail
          if [ -x tools/build.sh ]; then
            tools/build.sh --revision "$PACKAGE_REVISION" "${VERSION}"
          elif [ "$PACKAGE_REVISION" = 1 ] && [ -x build.sh ]; then
            build.sh "${VERSION}"
          else
            echo '::error::源码中没有支持包修订号的打包脚本'
            exit 1
          fi

      - name: 生成匹配发布包的版本专属 plg
        run: |
          set -euo pipefail
          pkg="dist/unraid-certbot-${VERSION}-noarch-${PACKAGE_REVISION}.txz"
          [ -s "$pkg" ] || { echo "::error::没有发布包 $pkg"; exit 1; }
          md5="$(md5sum "$pkg" | cut -d' ' -f1)"
          sha="$(sha256sum "$pkg" | cut -d' ' -f1)"
          plg="dist/unraid-certbot-${VERSION}.plg"
          sed -e "s|^<!ENTITY version   \"[^\"]*\">|<!ENTITY version   \"${VERSION}\">|" \
              -e "s|^<!ENTITY pkgfile   \"[^\"]*\">|<!ENTITY pkgfile   \"\&name;-\&version;-noarch-${PACKAGE_REVISION}.txz\">|" \
              -e "s|<MD5>[^<]*</MD5>|<MD5>${md5}</MD5>|" \
              -e "s|<SHA256>[^<]*</SHA256>|<SHA256>${sha}</SHA256>|" \
              unraid-certbot.plg > "$plg"
          cp "$plg" unraid-certbot.plg

      - name: 校验产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="dist/unraid-certbot-${VERSION}-noarch-${PACKAGE_REVISION}.txz"
          asset="unraid-certbot-${VERSION}-noarch-${PACKAGE_REVISION}.txz"
          [ -f "$pkg" ] || { echo "::error::没有产出 $pkg"; exit 1; }

          md5="$(md5sum "$pkg" | cut -d' ' -f1)"
          sha="$(sha256sum "$pkg" | cut -d' ' -f1)"
          plg="dist/unraid-certbot-${VERSION}.plg"

          # 校验和写错会让 Unraid 把 .plg 丢进 plugins-error/
          grep -q "<MD5>${md5}</MD5>" "$plg" \
            || { echo "::error::.plg 里的 MD5 与实际包不符"; exit 1; }
          grep -q "<SHA256>${sha}</SHA256>" "$plg" \
            || { echo "::error::.plg 里的 SHA256 与实际包不符"; exit 1; }

          # URL 与属性用的是 &version; 这类实体，必须展开后再比
          declared="$(xmllint --noent --xpath 'string(/PLUGIN/@version)' "$plg")"
          [ "$declared" = "$VERSION" ] \
            || { echo "::error::.plg 声明的版本是 ${declared}，与 tag ${VERSION} 不一致"; exit 1; }

          expanded="$(xmllint --noent "$plg")"
          grep -Fq "releases/download/${VERSION}/${asset}" <<<"$expanded" \
            || { echo "::error::.plg 里的下载地址没有指向本次 tag"; exit 1; }

          echo "校验通过：版本 ${declared}，MD5 ${md5}"

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="dist/unraid-certbot-${VERSION}-noarch-${PACKAGE_REVISION}.txz"
          plg="dist/unraid-certbot-${VERSION}.plg"

          # 从 .plg 的 CHANGES 里抽出本次版本的更新说明
          awk -v v="$VERSION" '
            index($0, "###" v) == 1 { capture = 1; next }
            /^###/          { capture = 0 }
            /^<\/CHANGES>/  { capture = 0 }
            capture { print }
          ' unraid-certbot.plg > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "unraid-certbot ${VERSION}" > /tmp/notes.md
          fi

          cat >> /tmp/notes.md <<EOF

          ## 安装

          最新版本：

          \`\`\`
          plugin install https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/unraid-certbot.plg
          \`\`\`

          指定版本 ${VERSION}：

          \`\`\`
          plugin install https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/unraid-certbot.plg
          \`\`\`
          EOF

          if gh release view "$VERSION" >/dev/null 2>&1; then
            existing="$(gh release view "$VERSION" --json assets \
              --jq ".assets[] | select(.name == \"$(basename "$pkg")\") | .digest")"
            expected="sha256:$(sha256sum "$pkg" | cut -d' ' -f1)"
            if [ -n "$existing" ]; then
              [ "$existing" = "$expected" ] \
                || { echo "::error::同名包已存在，但摘要为 ${existing}，本次为 ${expected}"; exit 1; }
            else
              gh release upload "$VERSION" "$pkg"
            fi
          else
            gh release create "$VERSION" \
              --verify-tag \
              --title "unraid-certbot ${VERSION}" \
              --notes-file /tmp/notes.md \
              "$pkg"
          fi

          published="$(gh release view "$VERSION" --json assets \
            --jq ".assets[] | select(.name == \"$(basename "$pkg")\") | .digest")"
          expected="sha256:$(sha256sum "$pkg" | cut -d' ' -f1)"
          [ "$published" = "$expected" ] \
            || { echo "::error::远端包摘要 ${published} 与本地 ${expected} 不符"; exit 1; }
          gh release upload "$VERSION" "$plg" --clobber
          gh release edit "$VERSION" --notes-file /tmp/notes.md

      - name: 更新安装入口和 tag
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp unraid-certbot.plg /tmp/unraid-certbot.plg
          git fetch origin "$DEFAULT_BRANCH"
          branch_version="$(git show "origin/$DEFAULT_BRANCH:VERSION" | tr -d '[:space:]')"
          branch_commit="$(git rev-parse "origin/$DEFAULT_BRANCH")"

          if [ "$branch_version" = "$VERSION" ]; then
            [ "$branch_commit" = "$source_commit" ] \
              || { echo '::error::默认分支在打包期间发生变化或 tag 未指向该分支'; exit 1; }
            git checkout -f -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          else
            # 历史版本仅更新 tag 内的 plg，不回退默认安装入口。
            git checkout -f --detach "$source_commit"
          fi
          cp /tmp/unraid-certbot.plg unraid-certbot.plg
          git add unraid-certbot.plg
          if ! git diff --cached --quiet; then
            git commit -m "release: ${VERSION} package revision ${PACKAGE_REVISION}"
          fi
          if [ "$branch_version" = "$VERSION" ]; then
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          old_tag="$(git ls-remote --tags --refs origin "refs/tags/$VERSION" | cut -f1)"
          [ -n "$old_tag" ] || { echo '::error::远端 tag 不存在'; exit 1; }
          git tag -f "$VERSION" HEAD
          git push --force-with-lease="refs/tags/${VERSION}:${old_tag}" origin \
            "refs/tags/$VERSION:refs/tags/$VERSION"

      - name: 发布结果
        run: |
          echo "### unraid-certbot ${VERSION}: ${RELEASE_MODE}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(tr -d '[:space:]' < VERSION)" = "$(git show "origin/$DEFAULT_BRANCH:VERSION" | tr -d '[:space:]')" ]; then
            echo "默认分支安装入口已更新。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "默认分支安装入口未更改。" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "最新版本：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/unraid-certbot.plg" >> "$GITHUB_STEP_SUMMARY"
          echo "指定版本：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/unraid-certbot.plg" >> "$GITHUB_STEP_SUMMARY"
